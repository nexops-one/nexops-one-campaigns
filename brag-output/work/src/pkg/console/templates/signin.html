{{define "content"}}
<h1>Sign in</h1>
{{with .Data}}
<form method="post" action="/console/signin" class="card narrow">
  <input type="hidden" name="csrf" value="{{$.CSRF}}">
  <input type="hidden" name="next" value="{{.Next}}">
  {{if .AskTenant}}
  <p><label for="tenant">Tenant</label>
  <input id="tenant" name="tenant" value="{{.Tenant}}" required autocomplete="organization"></p>
  {{end}}
  <p><label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{.Email}}" required autocomplete="username"></p>
  <p><label for="password">Password</label>
  <input id="password" name="password" type="password" required autocomplete="current-password"></p>
  <p><button type="submit">Sign in</button></p>
</form>
{{range .Providers}}
<p class="card narrow"><a class="button" href="{{.Path}}">{{.Label}}</a></p>
{{end}}
{{end}}
<p class="hint">Accounts are created by an administrator with <code>compliance-engine user create</code>.</p>
{{end}}
