# Offline deployment: PostgreSQL and the engine image loaded by install.sh.
# Copy .env.example to .env and fill it in, then: docker compose up -d
# The postgres image must be available locally too (docker load it from your
# own mirror if the site has no registry access).
name: compliance-engine

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: compliance
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliance"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  engine:
    image: compliance-engine:${COMPLIANCE_VERSION:?set COMPLIANCE_VERSION in .env}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COMPLIANCE_DATABASE_URL: postgres://compliance:${POSTGRES_PASSWORD}@postgres:5432/compliance?sslmode=disable
      COMPLIANCE_TOKENS: ${COMPLIANCE_TOKENS:-}
      COMPLIANCE_ENCRYPTION_KEY_FILE: /run/secrets/compliance-kek
      COMPLIANCE_CONSOLE_TENANT: ${COMPLIANCE_CONSOLE_TENANT:-}
      COMPLIANCE_LISTEN: ":8080"
      COMPLIANCE_AUTO_MIGRATE: "true"
      COMPLIANCE_LOG_LEVEL: info
    secrets:
      - compliance-kek
    ports:
      - "127.0.0.1:${COMPLIANCE_HOST_PORT:-8080}:8080"
    restart: unless-stopped

secrets:
  compliance-kek:
    file: ${COMPLIANCE_KEK_FILE:?create a KEK with bin/compliance-engine keys generate and set COMPLIANCE_KEK_FILE in .env}

volumes:
  pgdata: {}
