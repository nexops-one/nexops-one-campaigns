{{- if .Values.networkPolicy.enabled }}
# The engine makes no outbound call by default (no telemetry); egress is
# limited to DNS, the database, and what extraEgress adds (an SSO identity
# provider, hosts of COMPLIANCE_EVIDENCE_FETCH_ALLOW).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ce.fullname" . }}
  labels:
    {{- include "ce.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ce.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- else }}
      from:
        - podSelector: {}
      {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: {{ .Values.networkPolicy.database.port }}
          protocol: TCP
      {{- with .Values.networkPolicy.database.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
